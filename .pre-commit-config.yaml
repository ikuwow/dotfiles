# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types: [pre-commit, post-merge]
# Keep the file-based hooks out of post-merge, which passes them no files
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
      - id: check-symlinks
  - repo: local
    hooks:
      - id: verify-deploy
        name: Verify deploy.sh symlinks match verify_deploy.sh
        entry: scripts/verify_deploy.sh
        language: script
        pass_filenames: false
        files: ^scripts/(deploy|verify_deploy)\.sh$
      - id: check-rule-budget
        name: Enforce line-count budget on always-loaded AI rule files
        entry: scripts/check_rule_budget.sh
        language: script
        pass_filenames: false
        files: ^(AIRULES\.md|claude/rules/.*\.md)$
      - id: check-userscript-version
        name: Check userscript version bump
        entry: scripts/check_userscript_version.sh
        language: script
        files: ^userscripts/.*\.user\.js$
      # Main only: a deploy on a feature branch links files that disappear
      # on the next checkout
      - id: post-merge-deploy
        name: Deploy symlinks after a merge on main
        entry: bash -c 'if [ "$(git symbolic-ref --short -q HEAD)" = main ]; then scripts/deploy.sh; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-merge]
