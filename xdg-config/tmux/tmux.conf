# ~/.tmux.conf

# Prefix
set-option -g prefix C-q
unbind-key C-b
bind-key C-q send-prefix

set -g history-limit 5000
set-window-option -g mode-keys vi

set-option -g status-fg "colour255"
set-option -g status-bg "colour238"
# tmux's default status-right with the clock as 2026/11/16 (Mon) 12:07:00,
# redrawn every second for the seconds field
set-option -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %Y/%m/%d (%a) %H:%M:%S'
set-option -g status-right-length 60
set-option -g status-interval 1

set-option -g mouse on

# The terminal's title, and so its tab name, is the session name, which
# ide makes the project's directory name
set-option -g set-titles on
set-option -g set-titles-string '#S'

set-option -g focus-events on

# Tabs inside one pane slot, kept by tabs.sh: new shell tab, new Claude
# Code tab, next, previous
bind-key C-t run-shell '~/.config/tmux/tabs.sh new #{pane_id}'
bind-key C-a run-shell '~/.config/tmux/tabs.sh claude #{pane_id}'
bind-key C-n run-shell '~/.config/tmux/tabs.sh next #{pane_id}'
bind-key C-p run-shell '~/.config/tmux/tabs.sh prev #{pane_id}'
# Killing a tab closes it, so its slot shows the next tab; a slot killed
# otherwise, such as with kill-window, takes its hidden tabs with it
bind-key x if-shell -F '#{@tab_group}' {
  confirm-before -p 'close tab? (y/n)' { run-shell '~/.config/tmux/tabs.sh close #{pane_id}' }
} {
  confirm-before -p 'kill-pane #P? (y/n)' kill-pane
}
# A tab whose program exits stays open until tabs.sh swaps in another
set-hook -g pane-died {
  if-shell -F '#{@tab_group}' { run-shell '~/.config/tmux/tabs.sh died #{hook_pane}' }
}
# A hidden tab's label is a snapshot, retaken when the tab retitles itself
set-hook -g pane-title-changed {
  if-shell -F '#{==:#{session_name},tabs-store}' {
    run-shell -b '~/.config/tmux/tabs.sh render #{hook_pane}'
  }
}
# Every pane's top border lists its tabs, a pane without tabs as its one tab
set-option -g @tab_label '#{?#{==:#{pane_current_command},claude},#{=20:pane_title},#{pane_current_command}}'
set-option -g pane-border-format '#{?#{@tab_list},#{E:@tab_list},#[reverse] 1:#{E:@tab_label} #[noreverse]}'
set-option -g pane-border-status top

# Quit every program of the session as its user would, the tabs of its
# panes included, so the session closes; quit.sh stops at the first that
# stays, such as nvim with unsaved changes
bind-key X confirm-before -p 'quit session #S? (y/n)' {
  run-shell -b '~/.config/tmux/quit.sh #{q:session_id} #{q:client_name}'
}

set-window-option -g window-status-style dim
set-window-option -g window-status-current-style bright
