# ~/.tmux.conf

# Prefix
set-option -g prefix C-q
unbind-key C-b
bind-key C-q send-prefix

set -g history-limit 5000
set-window-option -g mode-keys vi

set-option -g status-fg "colour255"
set-option -g status-bg "colour238"
# tmux's default status-right with the clock as 2026/11/16 (Mon) 12:07:00,
# redrawn every second for the seconds field
set-option -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %Y/%m/%d (%a) %H:%M:%S'
set-option -g status-right-length 60
set-option -g status-interval 1

set-option -g mouse on

# The terminal's title, and so its tab name, is the session name
set-option -g set-titles on
set-option -g set-titles-string '#S'

set-option -g focus-events on

set-window-option -g window-status-style dim
set-window-option -g window-status-current-style bright
