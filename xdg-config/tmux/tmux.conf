# ~/.tmux.conf

# Prefix
set-option -g prefix C-q
unbind-key C-b
bind-key C-q send-prefix

set -g history-limit 5000
set-window-option -g mode-keys vi

set-option -g status-fg "colour255"
set-option -g status-bg "colour238"
# tmux's default status-right with the clock as 2026/11/16 (Mon) 12:07:00,
# redrawn every second for the seconds field
set-option -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %Y/%m/%d (%a) %H:%M:%S'
set-option -g status-right-length 60
set-option -g status-interval 1

set-option -g mouse on

set-option -g focus-events on

# Tabs inside one pane slot, kept by tmux-tabs: new shell tab, new Claude
# Code tab, next, previous
bind-key C-t run-shell '~/bin/tmux-tabs new #{pane_id}'
bind-key C-a run-shell '~/bin/tmux-tabs claude #{pane_id}'
bind-key C-n run-shell '~/bin/tmux-tabs next #{pane_id}'
bind-key C-p run-shell '~/bin/tmux-tabs prev #{pane_id}'
# Killing a pane closes its tab, so a slot with tabs shows the next one;
# a pane killed otherwise takes its hidden tabs with it
bind-key x confirm-before -p 'kill-pane #P? (y/n)' "run-shell '~/bin/tmux-tabs close #{pane_id}'"
# A tab whose program exits stays open until tmux-tabs swaps in another
set-hook -g pane-died "run-shell '~/bin/tmux-tabs died #{hook_pane}'"
# A parked tab's label is a snapshot, retaken when a pane retitles itself
set-hook -g pane-title-changed "run-shell -b '~/bin/tmux-tabs render #{hook_pane}'"
set-option -g pane-border-format '#{?#{@tab_list},#{E:@tab_list},}'

run-shell 'tmux setenv -g TMUX_VERSION $(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell '[ "$(echo "$TMUX_VERSION >= 2.9" | bc)" == 1 ]' " \
  set-window-option -g window-status-style fg=white; \
  set-window-option -g window-status-style bg=default; \
  set-window-option -g window-status-style dim; \
  set-window-option -g window-status-current-style fg=white; \
  set-window-option -g window-status-current-style bg=default; \
  set-window-option -g window-status-current-style bright;\
"

if-shell '[ "$(echo "$TMUX_VERSION < 2.9" | bc)"J == 1 ]' " \
  set-window-option -g window-status-fg white; \
  set-window-option -g window-status-bg default; \
  set-window-option -g window-status-attr dim; \
  set-window-option -g window-status-current-fg white; \
  set-window-option -g window-status-current-bg default; \
  set-window-option -g window-status-current-attr bright;\
"
