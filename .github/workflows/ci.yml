name: Lint
on: push
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_OPTS: '--exclude=SC1090,SC1091,SC2039,SC3010,SC3060,SC3028'
    steps:
      - uses: actions/checkout@v6
      - name: Display shellcheck version
        run: shellcheck --version
      - name: shellcheck
        run: |
          git ls-files -z '*.sh' | xargs -0 shellcheck --
          find claude/hooks/ -name '*.sh' -exec shellcheck {} +
          find bin/ -type f ! -name '*.md' -exec shellcheck {} +
          find claude-plugins/ -path '*/bin/*' -type f ! -name 'pr-monitor' -exec shellcheck {} +
          find xdg-config/git/hooks/ -type f -exec shellcheck {} +
          find gh-extensions/ -type f ! -name '*.md' ! -name 'LICENSE' -exec shellcheck {} +
          shellcheck --exclude SC2148 .bash_profile .bashrc
  python-doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: doctest
        run: |
          for f in claude/hooks/*.py; do
            echo "Testing $f"
            python3 -m doctest "$f"
          done
          # doctest reads a file without the .py suffix as text rather than as a module
          cp claude-plugins/pr-watch/bin/pr-monitor "$RUNNER_TEMP/pr_monitor.py"
          python3 -m doctest "$RUNNER_TEMP/pr_monitor.py"
